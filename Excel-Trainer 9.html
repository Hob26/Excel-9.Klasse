<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel-Trainer 9</title>
<style>
:root{--g:#217346;--g2:#185c37;--gl:#e9f5ee;--grid:#e1e1e1;--hd:#f3f3f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:13px;color:#222;background:#f3f3f3;overflow:hidden}
#app{height:100%}
button{font-family:inherit}
/* ---------- HOME ---------- */
.home{height:100%;overflow:auto;background:linear-gradient(180deg,#217346 0,#217346 210px,#f3f3f3 210px)}
.hwrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.hhead{color:#fff;display:flex;align-items:center;gap:18px;margin-bottom:26px}
.logo{width:64px;height:64px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hhead h1{margin:0;font-size:30px;font-weight:600}
.hhead p{margin:4px 0 0;opacity:.9;font-size:15px}
.namecard{background:#fff;border-radius:10px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.namecard input{font-size:16px;padding:8px 12px;border:1px solid #bbb;border-radius:6px;width:220px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.mod{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;position:relative;border-top:5px solid var(--g)}
.mod.lock{opacity:.55}
.mod .num{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.05em}
.mod h3{margin:0;font-size:18px}
.mod .desc{color:#555;font-size:13px;flex:1}
.bar{height:8px;background:#e6e6e6;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.btn{background:var(--g);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--g2)}
.btn:disabled{background:#aaa;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.sec:hover{background:var(--gl)}
.btn.sm{padding:6px 11px;font-size:13px}
.mod.test{border-top-color:#c55a11}
.hfoot{margin-top:28px;color:#666;font-size:12px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.hfoot a{color:#666;cursor:pointer;text-decoration:underline}
/* ---------- EXCEL ---------- */
.xl{display:flex;flex-direction:column;height:100%;background:#fff}
.tb{background:var(--g);color:#fff;height:38px;display:flex;align-items:center;padding:0 10px;gap:14px;flex:none;user-select:none}
.tb .back{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px}
.tb .back:hover{background:rgba(255,255,255,.28)}
.tb .ttl{flex:1;text-align:center;font-size:13px}
.tb .auto{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.tb .tog{width:30px;height:14px;border:1px solid #fff;border-radius:8px;position:relative}
.tb .tog:after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#fff}
.tb .ini{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.ribtabs{display:flex;gap:2px;padding:0 6px;background:#fff;flex:none;user-select:none}
.ribtabs button{border:0;background:none;padding:7px 10px 5px;font-size:13px;cursor:pointer;color:#333;border-bottom:3px solid transparent}
.ribtabs button.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
.ribtabs button.file{background:var(--g);color:#fff;border-radius:3px 3px 0 0}
.ribbon{display:flex!important;gap:0;align-items:center;padding:5px 8px!important;height:auto!important;}
.ribold{height:94px;display:flex;align-items:stretch;padding:4px 4px 2px;background:#f8f8f8;border-top:1px solid #e3e3e3;border-bottom:1px solid #d4d4d4;flex:none;overflow-x:auto;overflow-y:hidden;user-select:none}
.grp{display:flex;flex-direction:column;border-right:1px solid #dcdcdc;padding:0 7px;flex:none}
.grp .gb{flex:1;display:flex;align-items:center;gap:2px}
.grp .col{display:flex;flex-direction:column;gap:2px}
.grp .row{display:flex;gap:2px;align-items:center}
.grp .gl{font-size:11px;color:#666;text-align:center;padding-top:1px}
.rb{border:1px solid transparent;background:none;border-radius:3px;cursor:pointer;padding:2px 5px;font-size:12px;display:inline-flex;align-items:center;gap:4px;color:#222;min-height:24px;position:relative}
.rb:hover{background:#e3e3e3;border-color:#c8c8c8}
.rb.on{background:#c8dfd0;border-color:#8fbca0}
.rb.big{flex-direction:column;padding:3px 7px;height:70px;justify-content:center;gap:2px;line-height:1.1;text-align:center}
.rb.big .ic{font-size:22px;line-height:24px}
.rb .ic{font-size:14px}
.rb b.bb{font-family:Georgia,serif;font-size:15px}
select.rsel{height:24px;font-size:12px;border:1px solid #c6c6c6;background:#fff;width:132px}
.ribmsg{padding:20px;color:#777;font-size:13px}
.dd{position:fixed;background:#fff;border:1px solid #c6c6c6;box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:60;padding:3px 0;min-width:170px;font-size:13px}
.dd div{padding:5px 14px;cursor:pointer;white-space:nowrap}
.dd div:hover{background:#e5f1e9}
.dd .sw{display:inline-block;width:16px;height:16px;border:1px solid #999;vertical-align:middle;margin-right:8px}
.dd .pal{display:grid;grid-template-columns:repeat(6,22px);gap:4px;padding:6px 10px}
.dd .pal span{width:22px;height:22px;border:1px solid #aaa;cursor:pointer}
.fbar{display:flex;align-items:center;height:30px;border-bottom:1px solid #d4d4d4;padding:0 4px;gap:4px;flex:none;background:#fff}
#namebox{width:96px;height:23px;border:1px solid #c6c6c6;font:13px "Segoe UI",Arial;padding:0 5px}
.fbtns{display:flex;align-items:center;border-left:1px solid #ddd;border-right:1px solid #ddd;padding:0 4px;height:23px}
.fbtns span{display:inline-block;width:24px;text-align:center;color:#bbb;font-size:14px;user-select:none}
.fbtns span.act{color:#333;cursor:pointer}
.fbtns span.fx{font-style:italic;font-family:Georgia,serif;color:#333;cursor:pointer}
#fxin{flex:1;height:23px;border:1px solid #c6c6c6;font:14px Calibri,Carlito,"Segoe UI",Arial,sans-serif;padding:0 6px;outline:none}
#fxin:focus{border-color:var(--g)}
.main{flex:1;display:flex;min-height:0}
.gw{flex:1;overflow:auto;position:relative;background:#fff;outline:none}
.gi{position:relative;display:inline-block;min-width:100%}
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;font:14px Calibri,Carlito,"Segoe UI",Arial,sans-serif}
table.g td{height:20px;max-height:20px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0 3px;white-space:nowrap;line-height:19px;overflow:visible;user-select:none}
table.g td.clip{overflow:hidden}
table.g td.n{text-align:right}
table.g td.ce{text-align:center}
table.g td.insel{background-color:rgba(0,0,0,.09)!important}
table.g td.tgt{box-shadow:inset 0 0 0 2px rgba(255,160,0,.75)}
table.g th{background:var(--hd);font-weight:400;color:#444;border-right:1px solid #d6d6d6;border-bottom:1px solid #d6d6d6;font-size:12px;font-family:"Segoe UI",Arial,sans-serif;position:sticky;z-index:4;user-select:none;padding:0}
table.g thead th{top:0;height:22px;cursor:s-resize}
table.g tbody th{left:0;z-index:3;text-align:center;cursor:e-resize}
table.g thead th.corner{left:0;z-index:6;cursor:default}
table.g th.hs{background:#d9d9d9;color:var(--g);font-weight:600}
table.g thead th.hs{box-shadow:inset 0 -2px 0 var(--g)}
table.g tbody th.hs{box-shadow:inset -2px 0 0 var(--g)}
.rsz{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:7}
#selbox{position:absolute;border:2px solid var(--g);pointer-events:none;z-index:2;display:none}
#fillh{position:absolute;width:7px;height:7px;background:var(--g);border:1px solid #fff;z-index:3;cursor:crosshair;display:none}
#fillprev{position:absolute;border:1px dashed #555;pointer-events:none;z-index:2;display:none}
#clipbox{position:absolute;border:2px dashed var(--g);pointer-events:none;z-index:2;display:none;animation:ants 1s linear infinite}
@keyframes ants{50%{border-color:#7fbf9a}}
.refb{position:absolute;pointer-events:none;z-index:2;border:2px solid}
#celled{position:absolute;display:none;z-index:8;border:2px solid var(--g);font:14px Calibri,Carlito,"Segoe UI",Arial,sans-serif;padding:0 2px;outline:none;height:22px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pane{width:360px;flex:none;border-left:1px solid #d4d4d4;background:#fafafa;display:flex;flex-direction:column;min-height:0}
.ph{padding:10px 14px;border-bottom:1px solid #e0e0e0;background:#fff}
.ph .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--g);font-weight:700}
.ph h2{margin:2px 0 6px;font-size:17px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{width:22px;height:22px;border-radius:50%;background:#e4e4e4;color:#555;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600}
.dots span.done{background:var(--g);color:#fff}
.dots span.cur{outline:2px solid #c55a11;outline-offset:1px}
.pb{flex:1;overflow:auto;padding:12px 14px}
.pb h3{margin:0 0 8px;font-size:15px}
.instr{font-size:13.5px;line-height:1.5}
.instr code,.fbx code,.mb code,.res code,.steps code,.info code,.titem code{background:#eef3ef;border:1px solid #d5e3d9;border-radius:3px;padding:0 4px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;white-space:nowrap}
.instr kbd,.mb kbd,.steps kbd,.info kbd{background:#fff;border:1px solid #aaa;border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:11.5px;font-family:inherit}
.goto{color:var(--g);cursor:pointer;text-decoration:underline;font-weight:600}
.pbtns{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.fbx{border-radius:6px;padding:9px 11px;margin-top:9px;font-size:13px;line-height:1.45}
.fbx.ok{background:#e3f4e8;border:1px solid #9fd1ae}
.fbx.bad{background:#fdecea;border:1px solid #f1a9a0}
.fbx.tip{background:#fff6dc;border:1px solid #f0d27a}
.fbx.sol{background:#eaf1fb;border:1px solid #a8c3ea}
.fbx b.h{display:block;margin-bottom:2px}
.pf{padding:9px 14px;border-top:1px solid #e0e0e0;display:flex;gap:8px;flex-wrap:wrap;background:#fff}
.lnk{background:none;border:0;color:#555;cursor:pointer;font-size:12px;text-decoration:underline;padding:2px}
.titem{border:1px solid #e0e0e0;background:#fff;border-radius:6px;padding:8px 10px;margin-bottom:7px;font-size:13px;line-height:1.4;cursor:pointer}
.titem:hover{border-color:var(--g)}
.titem .pt{float:right;color:#c55a11;font-weight:700;font-size:12px}
.sheettabs{height:28px;background:#f3f3f3;border-top:1px solid #d4d4d4;display:flex;align-items:stretch;flex:none;padding-left:8px;user-select:none}
.sheettabs .nav{color:#999;padding:0 6px;display:flex;align-items:center}
.sheettabs .tab{padding:0 16px;display:flex;align-items:center;cursor:pointer;border-right:1px solid #d6d6d6;font-size:12.5px;color:#333}
.sheettabs .tab.on{background:#fff;color:var(--g);font-weight:700;box-shadow:inset 0 -3px 0 var(--g)}
.sheettabs .plus{padding:0 10px;display:flex;align-items:center;cursor:pointer;font-size:18px;color:#555}
.sheettabs .plus:hover,.sheettabs .tab:hover{background:#e6e6e6}
.sheettabs input{width:100px;font-size:12px}
.status{height:24px;background:#f3f3f3;border-top:1px solid #e0e0e0;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#444;flex:none;gap:20px;user-select:none}
.status .sp{flex:1}
.grp1{display:flex;align-items:center;gap:4px;padding:0 10px;border-right:1px solid #dcdcdc}
.grp1:last-child{border-right:0}
.grp1 .lbl{font-size:12px;color:#555}
.rb.lg{font-size:13px;padding:5px 10px;min-height:30px}
.goal{font-size:15.5px;font-weight:600;line-height:1.45;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff4e0;border:1.5px solid #f0a000;border-radius:14px;padding:3px 11px;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:10px}
.chip:hover{background:#ffe9bf}
ol.steps{margin:0 0 6px;padding:0;list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding:6px 8px 6px 36px;margin-bottom:5px;background:#fff;border:1px solid #e3e3e3;border-radius:6px;font-size:13.5px;line-height:1.45}
ol.steps li:before{content:counter(st);position:absolute;left:8px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.info{background:#eef5ff;border:1px solid #c5d9f2;border-radius:6px;padding:7px 10px;font-size:13px;margin-top:6px;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:1px solid #dfe7e2;border-radius:8px;padding:10px 12px;background:#fbfdfb}
.card .ct{font-size:12px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.04em}
.card .cx{font-family:Consolas,"Courier New",monospace;font-size:15px;font-weight:700;margin:6px 0;color:#222;word-break:break-word}
.card .cd{font-size:13px;color:#444;line-height:1.4}
.dlg.wide{max-width:760px}
label.titem{display:flex;gap:9px;align-items:flex-start}
label.titem input{width:18px;height:18px;margin-top:1px;accent-color:#217346;flex:none;cursor:pointer}
label.titem .tx{flex:1}
label.titem.ck{background:#eef7f1;border-color:#9fd1ae}
label.titem.ck .tx{color:#567}
.tcount{font-size:13px;margin-top:6px}
/* popups */
#ac{position:fixed;display:none;background:#fff;border:1px solid #a6a6a6;box-shadow:2px 3px 8px rgba(0,0,0,.2);z-index:70;min-width:210px;max-height:220px;overflow:auto;font-size:13px;font-family:"Segoe UI",Arial}
#ac div{padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
#ac div i{font-style:italic;font-family:Georgia,serif;font-size:11px;color:#fff;background:#3f7fbf;border-radius:2px;padding:0 3px}
#ac div.on{background:#cce4f7}
#acd{position:fixed;display:none;background:#fff;border:1px solid #a6a6a6;box-shadow:2px 3px 8px rgba(0,0,0,.2);z-index:70;width:250px;padding:6px 9px;font-size:12px;line-height:1.4}
#tip{position:fixed;display:none;background:#fff;border:1px solid #a6a6a6;box-shadow:2px 3px 8px rgba(0,0,0,.18);z-index:69;padding:3px 7px;font-size:12px;font-family:"Segoe UI",Arial;white-space:nowrap}
#tip a{color:#0563c1;text-decoration:underline;cursor:pointer}
#tip b{font-weight:700}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center}
.dlg{background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:560px;width:92%;max-height:88vh;display:flex;flex-direction:column}
.dlg .dh{padding:11px 16px;border-bottom:1px solid #e3e3e3;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.dlg .dc{padding:14px 16px;overflow:auto;font-size:13.5px;line-height:1.5}
.dlg .df{padding:10px 16px;border-top:1px solid #e3e3e3;display:flex;justify-content:flex-end;gap:8px}
.mb h4{margin:12px 0 4px;color:var(--g);font-size:14px}
.mb ul{margin:4px 0;padding-left:20px}
.mb table{border-collapse:collapse;margin:6px 0}
.mb td{border:1px solid #ccc;padding:3px 8px}
.fnlist{border:1px solid #ccc;height:180px;overflow:auto;margin:6px 0}
.fnlist div{padding:3px 8px;cursor:pointer}
.fnlist div.on{background:#cce4f7}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 22px;border-radius:24px;font-size:15px;font-weight:600;z-index:120;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
/* ---------- RESULT ---------- */
.res{height:100%;overflow:auto;background:#f3f3f3}
.rwrap{max-width:900px;margin:0 auto;padding:26px 20px 60px}
.rcard{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:20px 22px;margin-bottom:16px}
.rtop{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.grade{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex:none}
.grade b{font-size:46px;line-height:1}
.grade span{font-size:12px;opacity:.9}
.tbar{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;margin:7px 0}
.tbar .bar{height:14px;border-radius:7px}
table.it{width:100%;border-collapse:collapse;font-size:13px}
table.it td,table.it th{border-bottom:1px solid #e6e6e6;padding:7px 6px;text-align:left;vertical-align:top}
table.it th{color:#666;font-weight:600;font-size:12px}
.fbtext p{margin:0 0 9px;line-height:1.55;font-size:14.5px}
@media (max-width:900px){.pane{width:290px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ac"></div><div id="acd"></div><div id="tip"></div><div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colName(c){let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;}
function colIndex(s){let n=0;for(const ch of s.toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1;}
const A=(c,r)=>colName(c)+(r+1);
function parseA(a){const m=/^\$?([A-Z]{1,3})\$?(\d+)$/i.exec(String(a).trim());return m?{c:colIndex(m[1]),r:+m[2]-1}:null;}
const store={get(k,d){try{const v=localStorage.getItem('xltr9_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('xltr9_'+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem('xltr9_'+k);}catch(e){}}};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o,(k,v)=>k==='_ast'?undefined:v));

/* ---------- Datum ---------- */
const DAY=86400000,EPOCH=Date.UTC(1899,11,30);
const serial=(y,m,d)=>Math.round((Date.UTC(y,m-1,d)-EPOCH)/DAY);
function fromSerial(s){const d=new Date(EPOCH+Math.floor(s)*DAY);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),wd:d.getUTCDay()};}
function todaySerial(){const n=new Date();return serial(n.getFullYear(),n.getMonth()+1,n.getDate());}
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const LISTS=[['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],['Mo','Di','Mi','Do','Fr','Sa','So'],MO,['Jan','Feb','Mrz','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez']];

/* ---------- Fehlerwerte ---------- */
class XErr{constructor(e){this.e=e;}}
const isErr=v=>v instanceof XErr;
const E={NAME:new XErr('#NAME?'),VALUE:new XErr('#WERT!'),DIV0:new XErr('#DIV/0!'),REF:new XErr('#BEZUG!'),NUM:new XErr('#ZAHL!')};
class FErr extends Error{constructor(m,code){super(m);this.code=code;}}

/* ---------- Anzeige-Formate ---------- */
const pad=n=>String(n).padStart(2,'0');
function fmtGeneral(n){if(!isFinite(n))return '#ZAHL!';if(Number.isInteger(n)&&Math.abs(n)<1e11)return String(n);let s=+n.toPrecision(10);let t=String(s);if(/e/.test(t))t=s.toExponential(4).replace('e+','E+');return t.replace('.',',');}

  return f.replace(/("[^"]*"?)|(?<![A-Za-z0-9_ÄÖÜäöüß])(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(ÄÖÜäöüß])/g,(m,s,a1,col,a2,row)=>{
    if(s)return s;let c=colIndex(col),r=+row-1;if(!a1)c+=dc;if(!a2)r+=dr;if(c<0||r<0)return '#BEZUG!';return a1+colName(c)+a2+(r+1);});
}
function normalizeFormula(t){
  t=t.replace(/[„“”]/g,'"');let out='',inS=false;
  for(const ch of t){if(ch==='"'){inS=!inS;out+=ch;}else out+=inS?ch:ch.toUpperCase();}
  let d=0;inS=false;for(const ch of out){if(ch==='"'){inS=!inS;continue;}if(inS)continue;if(ch==='(')d++;if(ch===')')d--;}
  if(inS)out+='"';if(d>0)out+=')'.repeat(d);
  return out;
}
function mkCtx(sh){
  const cx={cache:new Map(),vis:new Set()};
  const X={sh,cx,
    cell:k=>sh.cells[k],
    val:k=>{const p=parseA(k);return cellValue(sh,p.c,p.r,cx);},
    evalF:f=>{try{return scalar(evalAst(parseFormula(f.slice(1)),sh,cx));}catch(e){return E.NAME;}},
    disp:k=>{const c=sh.cells[k];return fmtVal(X.val(k),c&&c.fmt);},
    isEmpty:k=>{const c=sh.cells[k];return !c||(c.f==null&&(c.v==null||c.v===''));}
  };
  return X;
}
function eq(a,b){
  if(a==null)a=0;if(b==null)b=0;
  if(typeof a==='number'&&typeof b==='number')return Math.abs(a-b)<1e-6;
  if(typeof a==='string'&&typeof b==='string')return a.trim().toLowerCase()===b.trim().toLowerCase();
  return a===b;
}

/* =====================================================================
   FEHLER-DIAGNOSE (kindgerechte Hinweise)
   ===================================================================== */
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function unknownIds(f){let T;try{T=tokenize(f.slice(1));}catch(e){return[];}const o=[];T.forEach((t,i)=>{if(t.t==='id'&&t.v!=='WAHR'&&t.v!=='FALSCH'){const isFn=T[i+1]&&T[i+1].t==='(';if(!isFn||!FN[t.v])o.push({v:t.v,fn:isFn});}});return o;}
function errDiag(f,v){
  if(v.e==='#NAME?'){
    const u=unknownIds(f);
    if(u.length){const x=u[0];
      if(x.fn){let best=null,bd=9;for(const n of FNAMES){const d=lev(x.v,n);if(d<bd){bd=d;best=n;}}
        return 'Excel kennt die Funktion <b>'+esc(x.v)+'</b> nicht (#NAME?).'+(bd<=3?' Meintest du <code>'+best+'</code>? Achte auf die Schreibweise.':'');}
      return 'Excel kennt das Wort <b>'+esc(x.v.toLowerCase())+'</b> nicht (#NAME?). <b>Wörter musst du in Anführungszeichen schreiben:</b> <code>"'+esc(x.v.toLowerCase())+'"</code>';}
    return 'Excel zeigt #NAME? – irgendetwas in der Formel kennt Excel nicht. Prüfe die Schreibweise.';}
  if(v.e==='#WERT!')return 'Excel zeigt #WERT! – du rechnest mit Text. Mit Wörtern kann Excel nicht rechnen. Prüfe, welche Zellen du angeklickt hast.';
  if(v.e==='#DIV/0!')return 'Excel zeigt #DIV/0! – du teilst durch 0 oder durch eine leere Zelle.';
  if(v.e==='#BEZUG!')return 'Excel zeigt #BEZUG! – ein Zellbezug ist ungültig.';
  return 'In der Zelle steht ein Fehler: '+v.e;
}
const fnUsed=(f,name)=>new RegExp('(^|[^A-ZÄÖÜ0-9])'+name+'\\(').test(String(f).toUpperCase().replace(/"[^"]*"/g,''));
const hasRef=f=>/(^|[^A-Z])\$?[A-Z]{1,3}\$?\d+/.test(String(f).toUpperCase().replace(/"[^"]*"/g,''));

const fail=(m,cell)=>({ok:false,msg:m,cell});
function checkFormula(t,X){
  const base=parseA(t.cells[0]);let note=null;
  for(let i=0;i<t.cells.length;i++){
    const k=t.cells[i],p=parseA(k),cell=X.cell(k),v=X.val(k);
    const expF=shiftFormula(t.expect,p.r-base.r,p.c-base.c);const ev=X.evalF(expF);
    if(X.isEmpty(k)){
      if(i>0&&!X.isEmpty(t.cells[0]))return fail('In '+t.cells[0]+' steht schon etwas – aber <b>'+k+'</b> ist noch leer. Ziehe die Formel mit dem Ausfüllkästchen ■ nach unten bis <b>'+t.cells[t.cells.length-1]+'</b>.',k);
      return fail('Die Zelle <b>'+k+'</b> ist noch leer.',k);}
    if(cell.f==null){
      if(eq(v,ev))return fail('In <b>'+k+'</b> steht das richtige Ergebnis – aber du hast es <b>eingetippt</b>. Lass Excel rechnen: Eine Formel beginnt immer mit <code>=</code>.',k);
      return fail('In <b>'+k+'</b> steht keine Formel. Eine Formel beginnt immer mit <code>=</code>.',k);}
    if(isErr(v)&&!isErr(ev))return fail('<b>'+k+':</b> '+errDiag(cell.f,v),k);
    const ok=t.accept?t.accept(v,ev,k,cell,X):eq(v,ev);
    if(!ok){const d=t.diagnose&&t.diagnose(k,cell,v,ev,X,i);return fail(d||('Das Ergebnis in <b>'+k+'</b> stimmt noch nicht. Deine Formel: <code>'+esc(cell.f)+'</code> – prüfe die angeklickten Zellen.'),k);}
    if(t.need&&!t.need.some(n=>fnUsed(cell.f,n)))return fail(t.needMsg||('Das Ergebnis stimmt – aber benutze dafür die Funktion <b>'+t.need[0]+'</b>.'),k);
    if(t.needRef&&!hasRef(cell.f))return fail('Richtiges Ergebnis – aber du hast mit festen Zahlen gerechnet. Klicke stattdessen die <b>Zellen</b> an. Dann rechnet Excel automatisch neu, wenn sich eine Zahl ändert.',k);
    if(t.fill&&i>0&&cell.src==='typed')note='Tipp: Statt jede Formel einzeln zu schreiben, kannst du sie mit dem Ausfüllkästchen ■ nach unten ziehen.';
  }
  return{ok:true,note};
}
function checkValues(t,X){
  const given=t.given||1;
  for(let i=0;i<t.cells.length;i++){
    const k=t.cells[i],exp=String(t.values[i]),d=X.disp(k).trim();
    if(d.toLowerCase()!==exp.toLowerCase()){
      const dg=t.diagnose&&t.diagnose(X,k,d,exp,i);if(dg)return fail(dg,k);
      if(d==='')return fail('<b>'+k+'</b> ist noch leer. Ziehe das Ausfüllkästchen ■ weiter – bis <b>'+t.cells[t.cells.length-1]+'</b>.',k);
      return fail('In <b>'+k+'</b> sollte „'+esc(exp)+'“ stehen, dort steht aber „'+esc(d)+'“.',k);}
  }
  const typed=t.cells.slice(given).some(k=>{const c=X.cell(k);return c&&c.src==='typed';});
  return{ok:true,note:typed?'Richtig! Aber mit dem Ausfüllkästchen ■ geht es viel schneller als abtippen – probier es beim nächsten Mal aus.':null};
}
function runCheck(t,sh){const X=mkCtx(sh);if(t.type==='formula')return checkFormula(t,X);if(t.type==='values')return checkValues(t,X);return t.check(X);}

 <h4>Was Excel automatisch fortsetzt</h4><ul><li><b>Wochentage & Monate:</b> Montag → Dienstag …, Januar → Februar …</li><li><b>Aufzählungen:</b> <code>1. Platz</code> → <code>2. Platz</code> … (Zahl, Punkt, Leerzeichen, Wort)</li><li><b>Zahlenfolge:</b> Zuerst <b>zwei Zahlen</b> markieren, damit Excel die Schrittgröße erkennt. Nur eine Zahl → Excel kopiert!</li><li><b>Wortfolge:</b> Alle Wörter der Reihenfolge markieren, dann ziehen.</li><li><b>Formeln:</b> Die Zellbezüge wandern mit: <code>=B4*C4</code> wird zu <code>=B5*C5</code>.</li></ul>`},

 merk:`<h4>ANZAHL</h4><ul><li>Zählt, in wie vielen Zellen eine <b>Zahl</b> steht.</li><li>Die Zahlen werden <b>nicht</b> zusammengerechnet!</li><li>Beispiel: <code>=ANZAHL(B5:B32)</code> → Wie viele Personen haben einen Laptop?</li></ul>
 <h4>ANZAHL2</h4><ul><li>Zählt jede <b>beschriftete</b> Zelle – egal ob Text oder Zahl.</li><li>Beispiel: <code>=ANZAHL2(A5:A32)</code> → Wie viele Personen arbeiten in der Firma?</li></ul>
 <h4>ANZAHLLEEREZELLEN</h4><ul><li>Zählt die <b>leeren</b> Zellen.</li><li>Beispiel: <code>=ANZAHLLEEREZELLEN(C5:C32)</code> → Wer hat noch kein Smartphone?</li></ul>
 <h4>Achtung</h4><ul><li><b>SUMME</b> addiert die Zahlen (z. B. Anzahl der Geräte). <b>ANZAHL</b> zählt die Zellen (z. B. Anzahl der Personen).</li></ul>`},

   hints:['Tippe <code>=HE</code> – Excel schlägt dir <b>HEUTE</b> vor.','Die Klammern bleiben leer: <code>=HEUTE()</code>'],solution:'B4: <code>=HEUTE()</code>',
   needMsg:'Das Datum stimmt – aber benutze die Funktion <code>=HEUTE()</code>. Dann ist es morgen automatisch das neue Datum.'},
  {type:'custom',sheet:'Datum',cells:['B3'],title:'Ein Datum eingeben',
   text:'Trage in <span class="goto" data-goto="B3">B3</span> deinen <b>nächsten</b> Geburtstag ein.<br><br>Schreibe im Format <b>TT.MM.JJJJ</b>, also z. B. <code>24.03.2027</code>.',
   hints:['Tag, Monat und Jahr werden durch <b>Punkte</b> getrennt. Excel erkennt das Datum dann automatisch.','Ist dein Geburtstag dieses Jahr schon vorbei? Dann nimm das <b>nächste</b> Jahr.'],solution:'Zum Beispiel <code>24.03.2027</code> in B3 eintippen',
   check:X=>{const c=X.cell('B3'),v=X.val('B3');if(X.isEmpty('B3'))return fail('B3 ist noch leer.','B3');
     if(typeof v!=='number'||!c||!isDateF(c.fmt))return fail('Excel hat das nicht als Datum erkannt. Schreibe mit Punkten: <b>TT.MM.JJJJ</b>, z. B. <code>24.03.2027</code>.','B3');
     const t=todaySerial();if(v<t)return fail('Dieses Datum liegt in der Vergangenheit. Nimm deinen <b>nächsten</b> Geburtstag – vielleicht ist er erst im nächsten Jahr.','B3');
     if(v>t+366)return fail('So lange musst du nicht warten! Nimm deinen <b>nächsten</b> Geburtstag.','B3');return{ok:true};}},
  {type:'formula',sheet:'Datum',cells:['B5'],expect:'=B3-B4',needRef:true,title:'Tage bis zum Geburtstag',
   text:'Berechne in <span class="goto" data-goto="B5">B5</span>, wie viele Tage es noch bis zu deinem Geburtstag dauert.<br><br>Ziehe dazu die zwei Datumswerte voneinander ab.',
   hints:['Das spätere Datum (Geburtstag) minus das frühere (heute).','Formel: <code>=B3-B4</code>'],solution:'B5: <code>=B3-B4</code>',
   diagnose:(k,c,v,ev)=>eq(v,-ev)?'Du bekommst eine negative Zahl – andersherum! <b>Geburtstag minus heute</b>: <code>=B3-B4</code>':null},
  {type:'custom',sheet:'Datum',cells:['B8'],title:'Ferienbeginn eintragen',
   text:'Angenommen, die Sommerferien beginnen am <b>02.08.2027</b>. Trage dieses Datum in <span class="goto" data-goto="B8">B8</span> ein.',
   hints:['Format TT.MM.JJJJ – mit Punkten.','Tippe <code>02.08.2027</code> und drücke <kbd>Enter ↵</kbd>.'],solution:'B8: <code>02.08.2027</code>',
   check:X=>{const c=X.cell('B8'),v=X.val('B8');if(X.isEmpty('B8'))return fail('B8 ist noch leer.','B8');if(!c||!isDateF(c.fmt)||typeof v!=='number')return fail('Excel hat das nicht als Datum erkannt. Schreibe <code>02.08.2027</code> – mit Punkten.','B8');if(v!==serial(2027,8,2))return fail('Das Datum stimmt nicht. Gesucht ist der <b>02.08.2027</b>.','B8');return{ok:true};}},
  {type:'custom',sheet:'Datum',cells:['B9'],title:'Der Shortcut Strg + .',
   text:'Es gibt noch einen schnelleren Weg zum heutigen Datum: eine Tastenkombination!<br><br>Klicke <span class="goto" data-goto="B9">B9</span> an, halte <kbd>Strg</kbd> gedrückt und drücke den <kbd>.</kbd> (Punkt).',
   hints:['Nicht tippen und nicht =HEUTE() schreiben – nur die Zelle markieren und die Tasten drücken.','Halte <kbd>Strg</kbd> gedrückt und tippe einmal auf die Punkt-Taste <kbd>.</kbd> (rechts neben dem Komma). Am Mac: <kbd>Ctrl</kbd> + <kbd>.</kbd>'],
   solution:'B9 markieren → Strg + . drücken',
   check:X=>{const c=X.cell('B9'),v=X.val('B9');if(X.isEmpty('B9'))return fail('B9 ist noch leer.','B9');if(c.f&&fnUsed(c.f,'HEUTE'))return fail('Richtig, aber probiere diesmal die Tastenkombination <kbd>Strg</kbd> + <kbd>.</kbd> aus. Lösche B9 mit <kbd>Entf</kbd> und versuche es nochmal.','B9');if(v!==todaySerial())return fail('In B9 soll das <b>heutige</b> Datum stehen.','B9');return{ok:true,note:'Unterschied: Strg + . schreibt ein <b>festes</b> Datum. =HEUTE() ändert sich jeden Tag.'};}},
  {type:'formula',sheet:'Datum',cells:['B10'],expect:'=B8-B9',needRef:true,title:'Tage bis zu den Ferien',
   text:'Berechne in <span class="goto" data-goto="B10">B10</span>, wie viele Tage es noch bis zu den Ferien sind.',
   hints:['Ferienbeginn minus heutiges Datum.','Formel: <code>=B8-B9</code>'],solution:'B10: <code>=B8-B9</code>',
   diagnose:(k,c,v,ev)=>eq(v,-ev)?'Negative Zahl – andersherum! <b>Ferien minus heute</b>.':null},
  {type:'custom',sheet:'Datum',cells:['B13','B14','B15'],title:'Rückgabe-Datum berechnen',
   text:'Du leihst ein Buch für <b>21 Tage</b> aus. Wann musst du es zurückgeben?<br><br>1. <span class="goto" data-goto="B13">B13</span>: heutiges Datum mit <code>=HEUTE()</code><br>2. <span class="goto" data-goto="B14">B14</span>: die Zahl <b>21</b><br>3. <span class="goto" data-goto="B15">B15</span>: Berechne das Rückgabedatum (Datum <b>plus</b> Tage).',
   hints:['Zu einem Datum kannst du Tage einfach <b>dazuzählen</b> (+).','B13: <code>=HEUTE()</code>, B14: <code>21</code>, B15: <code>=B13+B14</code>'],solution:'B13: <code>=HEUTE()</code>, B14: <code>21</code>, B15: <code>=B13+B14</code>',
   check:X=>{const t=todaySerial();if(X.isEmpty('B13'))return fail('B13 ist noch leer.','B13');const c13=X.cell('B13');if(X.val('B13')!==t)return fail('In B13 soll das heutige Datum stehen.','B13');if(!c13.f||!fnUsed(c13.f,'HEUTE'))return fail('B13 stimmt – aber nimm hier bitte die Funktion <code>=HEUTE()</code>.','B13');
     if(X.val('B14')!==21)return fail('In B14 soll die Zahl <b>21</b> stehen (die Ausleihdauer in Tagen).','B14');const c=X.cell('B15');if(X.isEmpty('B15'))return fail('B15 ist noch leer.','B15');if(!c.f)return fail('In B15 steht keine Formel. Rechne: <code>=B13+B14</code>','B15');
     const v=X.val('B15');if(isErr(v))return fail(errDiag(c.f,v),'B15');if(!eq(v,t+21))return fail('Das Rückgabedatum stimmt noch nicht. Rechne <b>heutiges Datum plus 21 Tage</b>.','B15');if(!isDateF(c.fmt))return fail('Das Ergebnis stimmt, wird aber als Zahl angezeigt. Formatiere B15 als <b>Datum, kurz</b> (Start → Zahl).','B15');
     if(!hasRef(c.f))return fail('Rechne mit den Zellen B13 und B14, nicht mit festen Zahlen: <code>=B13+B14</code>','B15');return{ok:true};}},
  {type:'formula',sheet:'Datum',cells:['B18'],expect:'=HEUTE()-14',need:['HEUTE'],title:'Tage rückwärts zählen',
   text:'Welches Datum war vor <b>14 Tagen</b>? Berechne es in <span class="goto" data-goto="B18">B18</span> mit der HEUTE-Funktion.',
   hints:['Du kannst direkt von HEUTE() Tage abziehen.','Formel: <code>=HEUTE()-14</code>'],solution:'B18: <code>=HEUTE()-14</code>',
   accept:(v,ev,k,c)=>eq(v,ev),diagnose:(k,c,v,ev)=>eq(v,ev+28)?'Das ist 14 Tage in der <b>Zukunft</b>. Rückwärts heißt: <b>minus</b>.':null}
 ],
 merk:`<h4>Heutiges Datum</h4><ul><li><code>=HEUTE()</code> zeigt immer das aktuelle Datum (Live-Funktion). Gut für Vorlagen.</li><li>Shortcut <kbd>Strg</kbd> + <kbd>.</kbd> schreibt das heutige Datum als <b>festen</b> Wert.</li></ul>
 <h4>Datum eingeben</h4><ul><li>Format <b>TT.MM.JJJJ</b>, z. B. <code>03.04.2023</code></li><li>Datumsformat einstellen: Register Start → Gruppe Zahl → <b>Datum, kurz</b></li></ul>
 <h4>Mit Datum rechnen</h4><ul><li><b>Differenz:</b> Datum minus Datum = Anzahl Tage → <code>=B3-B4</code></li><li><b>Summe:</b> Datum plus Tage = neues Datum → <code>=B13+B14</code></li><li><b>Rückwärts:</b> <code>=HEUTE()-2</code> → vor 2 Tagen</li></ul>`},

 merk:`<h4>Aufbau</h4><p>WENN die Ampel grün ist, DANN gehe ich, SONST bleibe ich stehen.</p><p><code>=WENN(Wahrheitstest;[Wert_wenn_wahr];[Wert_wenn_falsch])</code></p><p>Beispiel: <code>=WENN(A6="rot";"stehen";"gehen")</code></p>
 <ul><li>Die drei Teile werden mit <b>Semikolon ;</b> getrennt.</li><li><b>Wörter immer in „Anführungszeichen“</b> – sonst versteht Excel nicht, dass es ein Wort ist.</li></ul>
 <h4>Vergleichsoperatoren</h4><table><tr><td><code>=</code></td><td>gleich</td></tr><tr><td><code>&gt;</code></td><td>größer als</td></tr><tr><td><code>&lt;</code></td><td>kleiner als</td></tr><tr><td><code>&gt;=</code></td><td>größer oder gleich</td></tr><tr><td><code>&lt;=</code></td><td>kleiner oder gleich</td></tr><tr><td><code>&lt;&gt;</code></td><td>ungleich</td></tr></table>
 <h4>Rechnung statt Wort</h4><ul><li><code>=WENN(B4&gt;35;B4*$G$4;0)</code></li><li><code>$G$4</code>: Die Dollarzeichen halten die Zelle beim Ausfüllen fest.</li></ul>`}
];

  if(need&&!need.some(n=>fnUsed(cell.f,n)))return{p:max-1,msg:'Ergebnis richtig, aber ohne die Funktion '+need[0]+' gerechnet: <code>'+esc(cell.f)+'</code>'};

function buildSheet(d){const sh={name:d.name,nCols:d.cols||12,nRows:d.rows||30,colW:{},cells:{}};for(let c=0;c<sh.nCols;c++)sh.colW[c]=(d.w&&d.w[colName(c)])||80;
  for(const [k,spec] of Object.entries(d.data||{}))put(sh,k,spec);return sh;}
function put(sh,k,spec){const o=(spec&&typeof spec==='object')?spec:{v:spec};const cell={};if(typeof o.v==='string'&&o.v.startsWith('='))cell.f=o.v;else if(o.v!==undefined&&o.v!=='')cell.v=o.v;
  for(const p of ['fmt','b','i','u','fill','al','bd','sz','col'])if(o[p]!==undefined)cell[p]=o[p];sh.cells[k]=cell;}

function getEditText(cell){
  if(!cell)return '';if(cell.f!=null)return cell.f;const v=cell.v;if(v==null)return '';

function classify(cell){
  if(!cell||(cell.f==null&&(cell.v==null||cell.v==='')))return{t:'empty'};
  if(cell.f!=null)return{t:'formula'};
  const v=cell.v;if(typeof v==='number')return{t:'num',v};
  if(typeof v==='string'){
    for(let li=0;li<LISTS.length;li++){const idx=LISTS[li].findIndex(x=>x.toLowerCase()===v.trim().toLowerCase());if(idx>=0)return{t:'list',li,idx,up:v===v.toUpperCase()&&v.length>2};}
    const m=/^(.*?)(\d+)(\D*)$/.exec(v);if(m)return{t:'ntext',pre:m[1],n:+m[2],suf:m[3]};
  }
  return{t:'text'};
}
function fillSeries(cells,offsets,n){
  // cells: Quellzellen; liefert n neue Zellen
  const k=cells.length,K=cells.map(classify),out=[];
  const style=c=>{const o={};if(c)for(const p of ['fmt','b','i','u','fill','al','bd','sz','col'])if(c[p]!==undefined)o[p]=c[p];return o;};
  const copyAt=(srcIdx,tgtIdx)=>{const c=cells[srcIdx];if(!c)return null;const o=clone(c);delete o.src;if(o.f!=null){const a=offsets(tgtIdx),b=offsets(srcIdx);o.f=shiftFormula(o.f,a.dr-b.dr,a.dc-b.dc);}return o;};
  const all=t=>K.every(x=>x.t===t);
  for(let i=0;i<n;i++){
    const ti=k+i;let o=null;
    if(k===1){const x=K[0],c=cells[0];
      if(x.t==='num'&&isDateF(c.fmt)){o={...style(c),v:x.v+(c.fmt==='time'?(i+1)/24:(i+1))};}
      else if(x.t==='list'){const L=LISTS[x.li];let w=L[(x.idx+i+1)%L.length];if(x.up)w=w.toUpperCase();o={...style(c),v:w};}
      else if(x.t==='ntext'){o={...style(c),v:x.pre+(x.n+i+1)+x.suf};}
      else o=copyAt(0,ti);
    }else{
      if(all('num')){const xs=K.map(x=>x.v);let a,b;if(k===2){b=xs[1]-xs[0];a=xs[0];}else{const mx=(k-1)/2,my=xs.reduce((p,q)=>p+q,0)/k;let sxy=0,sxx=0;xs.forEach((y,j)=>{sxy+=(j-mx)*(y-my);sxx+=(j-mx)*(j-mx);});b=sxy/sxx;a=my-b*mx;}
        o={...style(cells[k-1]),v:Math.round((a+b*ti)*1e9)/1e9};}
      else if(all('list')&&K.every(x=>x.li===K[0].li)){const L=LISTS[K[0].li];const step=((K[1].idx-K[0].idx)%L.length+L.length)%L.length;o={...style(cells[k-1]),v:L[((K[k-1].idx+step*(i+1))%L.length)]};}
      else if(all('ntext')&&K.every(x=>x.pre===K[0].pre&&x.suf===K[0].suf)&&K[1].n!==K[0].n){const step=K[1].n-K[0].n;o={...style(cells[k-1]),v:K[0].pre+Math.max(0,K[k-1].n+step*(i+1))+K[0].suf};}
      else o=copyAt(i%k,ti);
    }
    if(o)o.src='fill';out.push(o);
  }
  return out;
}
function doFill(s,d){
  pushUndo();const sh=curSheet();

  if(APP.hintLvl<hints.length)hbtn=`<button class="btn sec sm" id="hint">💡 ${APP.hintLvl===0?'Tipp':'Noch ein Tipp'}</button>`;else hbtn=`<button class="btn sec sm" id="hint">🔑 Lösung zeigen</button>`;
  let hh='';for(let i=0;i<APP.hintLvl&&i<hints.length;i++)hh+=`<div class="fbx tip"><b class="h">💡 Tipp ${i+1}</b>${hints[i]}</div>`;
  if(APP.showSol)hh+=`<div class="fbx sol"><b class="h">🔑 Lösung</b>${t.solution}</div>`;
  pane.innerHTML=`<div class="ph"><div class="k">Modul ${m.nr} · ${esc(m.title)}</div><h2>Aufgabe ${APP.taskIdx+1} von ${n}</h2><div class="dots">${m.tasks.map((x,i)=>`<span class="${tprog(m.id,i).done?'done':''} ${i===APP.taskIdx?'cur':''}" data-ti="${i}" title="${esc(x.title)}">${tprog(m.id,i).done?'✓':i+1}</span>`).join('')}</div></div>
  <div class="pb">${(()=>{const x=(TT[m.id]||[])[APP.taskIdx];if(!x)return `<h3>${t.title}</h3><div class="instr">${t.text}</div>`;
     return `<div class="goal">${x.g}</div><div class="chip" data-goto="${x.c}">📍 Zelle ${x.c}</div><ol class="steps">${x.s.map(z=>'<li>'+z+'</li>').join('')}</ol>${x.i?'<div class="info">ℹ️ '+x.i+'</div>':''}`;})()}
   <div class="pbtns"><button class="btn sm" id="chk">✔ Prüfen</button>${hbtn}</div>${hh}
   ${APP.fb?`<div class="fbx ${APP.fb.cls}">${APP.fb.html}</div>`:''}
   ${p.done?`<div class="pbtns"><button class="btn" id="nxt">${APP.taskIdx<n-1?'Weiter zu Aufgabe '+(APP.taskIdx+2)+' →':'Modul abschließen 🎉'}</button></div>`:''}</div>
  <div class="pf"><button class="lnk" id="merk">📄 Merkblatt</button><button class="lnk" id="rst">↺ Arbeitsmappe zurücksetzen</button>${APP.taskIdx<n-1&&!p.done?'<button class="lnk" id="skip">Aufgabe überspringen ›</button>':''}</div>`;
  pane.querySelectorAll('[data-ti]').forEach(d=>d.onclick=()=>{APP.showSol=false;openTask(+d.dataset.ti);});
  pane.querySelectorAll('[data-goto]').forEach(g=>g.onclick=()=>{commitIfEditing();selectCell(g.dataset.goto);$('#gw').focus({preventScroll:true});});
  $('#chk').onclick=()=>{commitIfEditing();doCheck(true);};
  $('#hint').onclick=()=>{if(APP.hintLvl<hints.length){APP.hintLvl++;p.hints++;}else{APP.showSol=true;p.sol=true;}saveProg();renderPane();};
  const nx=$('#nxt');if(nx)nx.onclick=()=>{APP.showSol=false;if(APP.taskIdx<n-1)openTask(APP.taskIdx+1);else moduleDone();};
  const sk=$('#skip');if(sk)sk.onclick=()=>{APP.showSol=false;openTask(APP.taskIdx+1);};
  $('#merk').onclick=showMerk;
  $('#rst').onclick=()=>showModal('Arbeitsmappe zurücksetzen?','Alle Eingaben in dieser Arbeitsmappe werden gelöscht. Bereits gelöste Aufgaben bleiben gelöst.',[{t:'Abbrechen'},{t:'Zurücksetzen',p:1,f:()=>{APP.wb=newWB(APP.mod);APP.undo=[];saveWB();renderTabs();openTask(APP.taskIdx);}}]);
}
function doCheck(manual){
  const t=curTask();if(!t)return;const sh=APP.wb.sheets.find(s=>s.name===t.sheet)||curSheet();const p=tprog(APP.mod.id,APP.taskIdx);
  const r=runCheck(t,sh);
  if(r.ok){const first=!p.done;p.done=true;saveProg();APP.fb={cls:'ok',html:'<b class="h">✔ '+(['Super!','Richtig!','Klasse!','Perfekt!','Stark!'][APP.taskIdx%5])+'</b>'+(r.note||'Die Aufgabe ist gelöst.')};if(first)toast('✔ Aufgabe gelöst!');}
  else if(manual){p.tries++;saveProg();APP.fb={cls:'bad',html:'<b class="h">✘ Noch nicht ganz</b>'+r.msg+(p.tries>=2&&APP.hintLvl===0?'<br><br><i>Du kommst nicht weiter? Klicke auf 💡 Tipp.</i>':'')};if(r.cell&&APP.wb.sheets[APP.wb.active]===sh)selectCell(r.cell);}
  renderPane();
}
function autoCheck(){
  if(APP.test||!APP.mod)return;const m=APP.mod;let changed=false;
  m.tasks.forEach((t,i)=>{const p=tprog(m.id,i);if(p.done)return;const sh=APP.wb.sheets.find(s=>s.name===t.sheet);if(!sh)return;const r=runCheck(t,sh);
    if(r.ok){p.done=true;changed=true;if(i===APP.taskIdx){APP.fb={cls:'ok',html:'<b class="h">✔ '+(['Super!','Richtig!','Klasse!','Perfekt!','Stark!'][i%5])+'</b>'+(r.note||'Die Aufgabe ist gelöst.')};toast('✔ Aufgabe gelöst!');}}});
  if(changed){saveProg();renderPane();}
}
function moduleDone(){
  const m=APP.mod,n=m.tasks.length,d=modDone(m),noHint=m.tasks.filter((t,i)=>{const p=tprog(m.id,i);return p.done&&p.hints===0&&!p.sol;}).length;
  const idx=MODULES.indexOf(m),next=MODULES[idx+1];
  if(d<n){showModal('Fast geschafft!',`Du hast ${d} von ${n} Aufgaben gelöst. Die offenen Aufgaben sind in der Punkte-Leiste oben grau.`,[{t:'OK',p:1}]);return;}
  showModal('🎉 Modul '+m.nr+' geschafft!',`<p>Klasse${NAME?', '+esc(NAME):''}! Du hast alle ${n} Aufgaben gelöst – <b>${noHint}</b> davon ganz ohne Tipp.</p>`,[{t:'Zur Übersicht',f:()=>{saveWB();renderHome();}},next?{t:'Weiter mit Modul '+next.nr+' →',p:1,f:()=>{saveWB();openModule(idx+1);}}:{t:'Zum Abschlusstest →',p:1,f:()=>{saveWB();if(!NAME)renderHome();else openTest();}}]);
}
const MERK={
 grund:[{t:'Formel',x:'=B3+B4',d:'Immer mit = anfangen. Zellen anklicken statt Zahlen tippen.'},{t:'Rechenzeichen',x:'+  -  *  /',d:'plus, minus, mal, geteilt'},{t:'SUMME',x:'=SUMME(B4:B7)',d:'Addiert alle Zahlen von B4 bis B7. Der Doppelpunkt heißt „bis“.'},{t:'Euro-Format',x:'€',d:'Zellen markieren und oben auf € klicken.'}],
 auto:[{t:'Ausfüllkästchen',x:'■',d:'Das kleine grüne Quadrat unten rechts an der Zelle. Daran nach unten ziehen.'},{t:'Wochentage, Monate, Plätze',x:'Montag → Dienstag …',d:'Eine Zelle markieren und ziehen.'},{t:'Zahlenfolge',x:'30, 27 → 24, 21 …',d:'Zuerst ZWEI Zahlen markieren, dann ziehen.'},{t:'Formel ausfüllen',x:'=B4*C4 → =B5*C5',d:'Excel passt die Zeile automatisch an.'}],
 anzahl:[{t:'ANZAHL',x:'=ANZAHL(B5:B32)',d:'Zählt die Zellen, in denen eine Zahl steht.'},{t:'ANZAHL2',x:'=ANZAHL2(A5:A32)',d:'Zählt alle Zellen, in denen etwas steht – auch Text.'},{t:'ANZAHLLEEREZELLEN',x:'=ANZAHLLEEREZELLEN(C5:C32)',d:'Zählt die leeren Zellen.'},{t:'Achtung',x:'SUMME ≠ ANZAHL',d:'SUMME rechnet die Zahlen zusammen. ANZAHL zählt nur die Zellen.'}],
 datum:[{t:'Heute (automatisch)',x:'=HEUTE()',d:'Zeigt immer das aktuelle Datum an.'},{t:'Heute (fest)',x:'Strg + .',d:'Schreibt das heutige Datum fest in die Zelle.'},{t:'Datum eingeben',x:'24.03.2027',d:'Tag.Monat.Jahr – mit Punkten.'},{t:'Tage ausrechnen',x:'=B3-B4',d:'Datum minus Datum = Anzahl der Tage.'},{t:'Datum + Tage',x:'=B13+B14',d:'Ergibt ein neues Datum.'}],
 wenn:[{t:'Aufbau',x:'=WENN(Bedingung;dann;sonst)',d:'Die drei Teile mit ; (Semikolon) trennen.'},{t:'Mit Wörtern',x:'=WENN(A6="rot";"stehen";"gehen")',d:'Wörter immer in "Anführungszeichen".'},{t:'Vergleichen',x:'>   <   >=   <=   =',d:'größer · kleiner · größer oder gleich · kleiner oder gleich · gleich'},{t:'Mit Rechnung',x:'=WENN(B4>35;B4*$G$4;0)',d:'Das $ hält eine Zelle beim Ziehen fest.'}]};
function merkHTML(id){return '<div class="cards">'+(MERK[id]||[]).map(c=>`<div class="card"><div class="ct">${esc(c.t)}</div><div class="cx">${esc(c.x)}</div><div class="cd">${esc(c.d)}</div></div>`).join('')+'</div>';}
function showMerk(intro){const m=APP.mod;showModal(intro?'Modul '+m.nr+': '+esc(m.title):'📄 Merkblatt: '+esc(m.title),(intro?'<p style="margin-top:0"><b>Das lernst du in diesem Modul:</b></p>':'')+merkHTML(m.id)+(intro?'<p style="color:#666;font-size:12.5px;margin-bottom:0">Du kannst das Merkblatt jederzeit oben über 📄 Merkblatt wieder öffnen.</p>':''),[{t:intro?'Los geht\'s!':'Schließen',p:1}],'wide');}
function renderTestPane(pane){
  const ck=new Set(store.get('testChecks',[]));const done=TEST_ITEMS.filter(it=>ck.has(it.id)).length;
  pane.innerHTML=`<div class="ph"><div class="k" style="color:#c55a11">Abschlusstest</div><h2>Klassenfahrt der 9b</h2><div style="font-size:12px;color:#666">12 Aufgaben · 24 Punkte · keine Tipps</div>
   <div class="tcount"><b>${done} von ${TEST_ITEMS.length}</b> Aufgaben abgehakt</div><div class="bar" style="margin-top:4px"><i style="width:${done/TEST_ITEMS.length*100}%"></i></div></div>
  <div class="pb"><div class="instr" style="margin-bottom:10px">Klicke auf eine Aufgabe, um zur Zelle zu springen. Wenn du fertig bist, setze ein <b>Häkchen ✓</b>. Rechne immer mit <b>Formeln</b>!</div>
  ${TEST_ITEMS.map((it,i)=>`<label class="titem ${ck.has(it.id)?'ck':''}" data-c="${it.cell}"><input type="checkbox" data-id="${it.id}" ${ck.has(it.id)?'checked':''}><span class="tx"><b>${i+1}.</b> ${it.text}</span><span class="pt">${it.max} P.</span></label>`).join('')}</div>
  <div class="pf"><button class="btn" style="background:#c55a11" id="abgabe">📨 Abgeben</button><button class="lnk" id="trst">↺ Test neu starten</button></div>`;
  pane.querySelectorAll('.titem').forEach(d=>d.addEventListener('click',e=>{if(e.target.tagName==='INPUT')return;e.preventDefault();commitIfEditing();selectCell(d.dataset.c);$('#gw').focus({preventScroll:true});}));
  pane.querySelectorAll('input[data-id]').forEach(cb=>cb.onchange=()=>{const set=new Set(store.get('testChecks',[]));if(cb.checked)set.add(cb.dataset.id);else set.delete(cb.dataset.id);store.set('testChecks',[...set]);const sc=pane.querySelector('.pb').scrollTop;renderTestPane(pane);pane.querySelector('.pb').scrollTop=sc;});
  $('#abgabe').onclick=()=>{commitIfEditing();const open=TEST_ITEMS.length-new Set(store.get('testChecks',[])).size;
    showModal('Test abgeben?',open>0?`Du hast <b>${open} Aufgabe${open===1?'':'n'}</b> noch nicht abgehakt. Willst du trotzdem abgeben?`:'Alle Aufgaben sind abgehakt. Jetzt abgeben?',[{t:'Weiterarbeiten'},{t:'Jetzt abgeben',p:1,f:gradeTest}]);};
  $('#trst').onclick=()=>showModal('Test neu starten?','Alle deine Eingaben im Test werden gelöscht.',[{t:'Abbrechen'},{t:'Neu starten',p:1,f:()=>{store.del('wb_test');store.del('testChecks');openTest();}}]);
}

/* =====================================================================
   TEST-AUSWERTUNG
   ===================================================================== */
function gradeTest(){
  const X=mkCtx(APP.wb.sheets[0]);const items=TEST_ITEMS.map((it,i)=>{const g=it.grade(X);return{nr:i+1,topic:it.topic,max:it.max,p:g.p,msg:g.msg,text:it.text};});
  const pts=items.reduce((s,x)=>s+x.p,0),max=items.reduce((s,x)=>s+x.max,0),pct=pts/max*100,note=noteFor(pct);
  const topics={};for(const it of items){topics[it.topic]=topics[it.topic]||{p:0,max:0};topics[it.topic].p+=it.p;topics[it.topic].max+=it.max;}
  const practice={};MODULES.forEach(m=>{let h=0,s=0;m.tasks.forEach((t,i)=>{const p=tprog(m.id,i);h+=p.hints;if(p.sol)s++;});practice[m.id]={hints:h,sol:s};});
  const res={name:NAME,pts,max,pct,note,items,topics,practice,date:fmtDate(todaySerial())};
  res.feedback=buildFeedback(res);store.set('lastResult',res);saveWB();renderResult(res);
}
function buildFeedback(r){
  const n=esc(r.name||'du'),P=[];
  const open={1:`Hervorragend, ${n}! Du beherrschst die Excel-Grundlagen richtig sicher – damit bist du bestens vorbereitet.`,2:`Sehr gut gemacht, ${n}! Fast alles sitzt schon richtig sicher.`,3:`Gut gemacht, ${n}! Vieles klappt schon sicher. An ein paar Stellen kannst du noch üben.`,4:`${n}, du hast die Grundlagen verstanden – einige Funktionen sitzen aber noch nicht ganz.`,5:`${n}, das war noch ziemlich schwierig für dich. Kein Problem: Mit etwas Übung schaffst du das!`,6:`${n}, Excel ist für dich noch neu. Lass dich nicht entmutigen – arbeite die Module noch einmal in Ruhe durch.`};
  P.push(open[r.note]);
  const T=Object.entries(r.topics).map(([k,v])=>({k,...v,pct:v.p/v.max*100}));
  const strong=T.filter(t=>t.pct>=80),weak=T.filter(t=>t.pct<60);
  if(strong.length)P.push('<b>Das kannst du schon richtig gut:</b> '+strong.map(t=>TOPICS[t.k]+' ('+t.p+'/'+t.max+' P.)').join(', ')+'.');
  if(weak.length){P.push('<b>Hier solltest du noch üben:</b>');weak.forEach(t=>{const m=MODULES.find(x=>x.id===t.k);const bad=r.items.find(i=>i.topic===t.k&&i.p<i.max);P.push('• <b>'+TOPICS[t.k]+'</b> ('+t.p+'/'+t.max+' P.): '+TOPIC_TIP[t.k]+(m?' → Wiederhole <b>Modul '+m.nr+'</b>.':''));});}
  const mid=T.filter(t=>t.pct>=60&&t.pct<80);if(mid.length)P.push('<b>Fast sicher:</b> '+mid.map(t=>TOPICS[t.k]).join(', ')+' – hier fehlte nur noch wenig.');
  const typed=r.items.filter(i=>/eingetippt|feste[n]? Zahlen|abgetippt/.test(i.msg)).length;
  if(typed)P.push('💡 Bei '+typed+(typed===1?' Aufgabe':' Aufgaben')+' hast du Ergebnisse oder Zahlen eingetippt. Lass Excel rechnen und klicke Zellen an – dann stimmt alles auch dann noch, wenn sich die Zahlen ändern.');
  const hintTot=Object.values(r.practice).reduce((s,x)=>s+x.hints,0);
  const improved=T.filter(t=>t.pct>=80&&r.practice[t.k]&&r.practice[t.k].hints>=2).map(t=>TOPICS[t.k]);
  if(hintTot===0)P.push('Im Training hast du <b>keinen einzigen Tipp</b> gebraucht. Stark!');
  else if(improved.length)P.push('Im Training hast du bei '+improved.join(' und ')+' noch Tipps gebraucht – im Test hat es dann super geklappt. Üben lohnt sich!');
  P.push(r.note<=2?'Weiter so! Als Nächstes kannst du ausprobieren, Funktionen zu kombinieren, z. B. <code>=WENN(ANZAHL(B5:B10)&gt;3;"viele";"wenige")</code>.':r.note<=4?'Tipp: Wiederhole die genannten Module und mach den Test danach noch einmal.':'Tipp: Starte noch einmal mit Modul 1 und nutze die Merkblätter. Danach klappt der Test bestimmt besser!');
  return P;
}
function renderResult(r){
  if(!r){renderHome();return;}APP.view='result';APP.wb=null;hidePopups();
  const col=NOTE_COL[r.note];
  const h=`<div class="res"><div class="rwrap">
  <div class="rcard"><div class="rtop"><div class="grade" style="background:${col}"><span>Note</span><b>${r.note}</b><span>${NOTE_TXT[r.note]}</span></div>
   <div style="flex:1;min-width:240px"><div style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.05em">Abschlusstest Excel · ${esc(r.date)}</div><h2 style="margin:4px 0 6px;font-size:24px">${esc(r.name||'')}: ${r.pts} von ${r.max} Punkten (${Math.round(r.pct)} %)</h2>
   <div style="color:#666;font-size:12.5px">Die Note ist fiktiv und dient nur zur Orientierung. Notenschlüssel: ab 90 % → 1, ab 77 % → 2, ab 63 % → 3, ab 50 % → 4, ab 30 % → 5.</div></div></div></div>
  <div class="rcard"><h3 style="margin-top:0">Dein persönliches Feedback</h3><div class="fbtext">${r.feedback.map(p=>'<p>'+p+'</p>').join('')}</div></div>
  <div class="rcard"><h3 style="margin-top:0">Punkte nach Themen</h3>${Object.entries(r.topics).map(([k,v])=>{const pc=v.p/v.max*100;return `<div class="tbar"><span>${TOPICS[k]}</span><div class="bar"><i style="width:${pc}%;background:${pc>=80?'#217346':pc>=60?'#c58a11':'#c55a11'}"></i></div><b>${v.p}/${v.max} P.</b></div>`;}).join('')}</div>
  <div class="rcard"><h3 style="margin-top:0">Alle Aufgaben im Detail</h3><table class="it"><tr><th>Nr.</th><th>Aufgabe</th><th>Punkte</th><th>Kommentar</th></tr>${r.items.map(i=>`<tr><td>${i.nr}</td><td style="width:34%">${i.text}</td><td style="white-space:nowrap;font-weight:700;color:${i.p===i.max?'#217346':i.p>0?'#c58a11':'#b42318'}">${i.p}/${i.max}</td><td>${i.msg}</td></tr>`).join('')}</table></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="rhome">Zur Übersicht</button><button class="btn sec" id="rtest">Test wiederholen</button><button class="btn sec" id="rview">Meine Test-Tabelle ansehen</button><button class="btn sec" id="rcopy">📋 Ergebnis für die Lehrkraft kopieren</button></div>
  </div></div>`;
  $('#app').innerHTML=h;
  $('#rhome').onclick=renderHome;$('#rtest').onclick=()=>{store.del('wb_test');store.del('testChecks');openTest();};$('#rview').onclick=openTest;
  $('#rcopy').onclick=async()=>{const txt=`Excel-Abschlusstest – ${r.name} – ${r.date}\nPunkte: ${r.pts}/${r.max} (${Math.round(r.pct)} %) – fiktive Note ${r.note}\n`+Object.entries(r.topics).map(([k,v])=>`${TOPICS[k]}: ${v.p}/${v.max}`).join('\n')+'\n\n'+r.items.map(i=>`${i.nr}. ${i.p}/${i.max} – ${i.msg.replace(/<[^>]+>/g,'')}`).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('📋 Kopiert!');}catch(e){showModal('Kopieren nicht möglich','<textarea style="width:100%;height:220px">'+esc(txt)+'</textarea><p>Markiere den Text und kopiere ihn mit Strg + C.</p>',[{t:'OK',p:1}]);}};
}

/* =====================================================================
   ALLGEMEIN
   ===================================================================== */
function afterChange(noSave){if(!noSave)saveWB();updateCells();updateSel();autoCheck();}
function showModal(title,html,btns,cls){
  closeModal();APP.modal=true;hidePopups();const m=document.createElement('div');m.className='mask';m.id='mask';
  m.innerHTML=`<div class="dlg ${cls||''}"><div class="dh">${title}</div><div class="dc">${html}</div><div class="df">${btns.map((b,i)=>`<button class="btn ${b.p?'':'sec'}" data-b="${i}">${b.t}</button>`).join('')}</div></div>`;
  document.body.appendChild(m);m.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{const b=btns[+el.dataset.b];closeModal();b.f&&b.f();});
}
function closeModal(){const m=$('#mask');if(m)m.remove();APP.modal=false;}
let toastT=null;function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',1800);}

renderHome();
</script>
